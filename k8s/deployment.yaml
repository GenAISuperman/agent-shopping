apiVersion: apps/v1
kind: Deployment
metadata:
  name: "shopping"
  namespace: "agents-retail-eng"
  labels:
    app: "shopping"
    team: "retail-eng"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "shopping"
  template:
    metadata:
      labels:
        app: "shopping"
        team: "retail-eng"
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: "sa-shopping"
      containers:
        - name: "shopping"
          image: "acrshoppoc.azurecr.io/agents/shopping:latest"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: "config-shopping"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
